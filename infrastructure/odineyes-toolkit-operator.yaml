AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Scoped operator role for Odineyes Agent Toolkit. It can release the existing
  application and manage Odineyes real-time infrastructure, but cannot create
  arbitrary IAM users, access customer accounts directly, or administer AWS.

Resources:
  OdineyesToolkitOperator:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OdineyesToolkitOperator
      Description: Scoped operator role used by the Odineyes Agent Toolkit profile.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOdineyesInfraDeployer
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/OdineyesInfraDeployer'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/OdineyesApplicationRelease'
      Policies:
        - PolicyName: OdineyesToolkitInfrastructure
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageOdineyesCloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeEvents
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: ManageOdineyesRegionalEventBridge
                Effect: Allow
                Action:
                  - events:CreateEventBus
                  - events:DeleteEventBus
                  - events:DescribeEventBus
                  - events:DescribeRule
                  - events:ListRules
                  - events:ListTargetsByRule
                  - events:ListTagsForResource
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:PutPermission
                  - events:RemovePermission
                  - events:TagResource
                  - events:UntagResource
                Resource: '*'
              - Sid: ManageOdineyesRealtimeQueues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:DeleteQueue
                Resource: !Sub 'arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:*'
              - Sid: UpdateOdineyesWorkerRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/OdineyesBootstrap-OdineyesInstanceRole-*'
              - Sid: PassOnlyOdineyesInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/OdineyesBootstrap-OdineyesInstanceRole-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
      Tags:
        - Key: ManagedBy
          Value: Odineyes
        - Key: Purpose
          Value: AgentToolkitOperator

  OdineyesInfraDeployerAssumeToolkitRole:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AssumeOdineyesToolkitOperator
      Users:
        - OdineyesInfraDeployer
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AssumeScopedToolkitRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt OdineyesToolkitOperator.Arn

Outputs:
  RoleArn:
    Description: Configure this as the agent-toolkit profile role_arn.
    Value: !GetAtt OdineyesToolkitOperator.Arn
