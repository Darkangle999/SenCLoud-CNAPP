[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odineyes"
version = "2.0.0"
description = "Next-generation multicloud GRC security scanning platform (AWS | Azure | GCP)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Odineyes Team" }]
keywords = ["security", "cloud", "aws", "azure", "gcp", "compliance", "grc", "devsecops"]

# Core deps only — cloud SDKs are optional
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8.0",
    "requests>=2.31.0,<3",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.28.0",
    "botocore>=1.31.0",
]
azure = [
    "azure-identity>=1.14.0",
    "azure-mgmt-storage>=21.0.0",
    "azure-mgmt-compute>=30.0.0",
    "azure-mgmt-network>=23.0.0",
    "azure-mgmt-authorization>=3.0.0",
]
gcp = [
    "google-cloud-storage>=2.10.0",
    "google-auth>=2.22.0",
    "google-api-python-client>=2.97.0",
]
all = [
    "odineyes[aws,azure,gcp]",
]
# Persistence spine (Phase 1): dual-store backend. SQLAlchemy is portable
# (sqlite for dev/test, Postgres in prod); psycopg is the Postgres driver.
db = [
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",        # required by starlette TestClient (API tests)
    "black>=23.0",
    "ruff>=0.1.0",
]

# THIS is the entry point that creates the `odineyes` command
[project.scripts]
odineyes = "odineyes.cli:cli"

[project.urls]
Homepage = "https://github.com/yourorg/odineyes"

# src layout — tells setuptools where the package lives
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
odineyes = ["core/templates/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["src/odineyes/tests"]
python_files = ["test_*.py"]
