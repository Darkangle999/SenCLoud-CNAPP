  # ------------------------------------------------------------- deny guardrail
  CSPMDataGuardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RoleName}-Data-Guard"
      Description: >-
        Explicit Deny guardrail. Narrows the Get*/List*/Describe* wildcards above so
        the CSPM role can never read secret material, customer data-plane content,
        log or source content, or escalate/pivot. Deny always wins in IAM.
        This is a deliberate product boundary, not an oversight: data classification
        for S3 comes from Macie findings (macie2:Get*/List*, granted above), never
        from this role reading objects itself. Onboarding probes s3:GetObject and
        dynamodb:GetItem expecting refusal, so a weakened guard is reported rather
        than silently trusted. Relaxing this needs a separate opt-in role scoped to
        named buckets — never a wider grant here.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenySecretMaterial
            Effect: Deny
            Resource: "*"
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:BatchGetSecretValue
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:GetParameterHistory
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyPair
              - kms:GenerateDataKeyPairWithoutPlaintext
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:GenerateRandom
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
              - ec2:GetPasswordData
              - redshift:GetClusterCredentials
              - redshift:GetClusterCredentialsWithIAM
              - rds-db:connect
              - ecr:GetAuthorizationToken
              - ecr-public:GetAuthorizationToken
              - gamelift:GetComputeAuthToken
              - codeartifact:GetAuthorizationToken
              - datazone:GetEnvironmentCredentials
              - elasticmapreduce:GetClusterSessionCredentials
              - lakeformation:GetDataAccess
              - lakeformation:GetTemporaryGluePartitionCredentials
              - lakeformation:GetTemporaryGlueTableCredentials
              - lightsail:GetRelationalDatabaseMasterUserPassword
              - redshift-serverless:GetCredentials
              - storagegateway:DescribeChapCredentials
          - Sid: DenyCustomerDataPlane
            Effect: Deny
            Resource: "*"
            Action:
              - s3:GetObject
              - s3:GetObjectAttributes
              - s3:GetObjectTorrent
              - s3:GetObjectVersion
              - s3:GetObjectVersionAttributes
              - s3:GetObjectVersionForReplication
              - s3:GetObjectVersionTorrent
              - s3-object-lambda:GetObject
              - s3-object-lambda:GetObjectVersion
              - dynamodb:BatchGetItem
              - dynamodb:GetItem
              - dynamodb:GetRecords
              - dynamodb:PartiQLSelect
              - dynamodb:Query
              - dynamodb:Scan
              - cassandra:Select
              - sqs:ReceiveMessage
              - kinesis:GetRecords
              - kinesis:GetShardIterator
              - kinesis:SubscribeToShard
              - athena:GetQueryResults
              - athena:GetQueryResultsStream
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds-data:ExecuteSql
              - redshift-data:ExecuteStatement
              - redshift-data:BatchExecuteStatement
              - redshift-data:GetStatementResult
              - timestream:Select
              - iot:GetThingShadow
              - iotsitewise:GetAssetPropertyValue
              - sms-voice:DescribeOptedOutNumbers
              - sms-voice:DescribePhoneNumbers
              - sms-voice:DescribeVerifiedDestinationNumbers
          - Sid: DenyLogAndSourceContent
            Effect: Deny
            Resource: "*"
            Action:
              - logs:GetLogEvents
              - logs:FilterLogEvents
