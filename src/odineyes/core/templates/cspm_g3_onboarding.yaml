  # -------------------------------------------------- optional: disk scan role
  CSPMDiskScanRole:
    Type: AWS::IAM::Role
    Condition: ScanEnabled
    Properties:
      RoleName: !Sub "${RoleName}-DiskScan"
      Description: >-
        Agentless disk scanning role. Separate from the read role because the
        read role's Deny guard blocks the KMS grants snapshot copy requires.
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CSPMPlatformAssumeScanRole
            Effect: Allow
            Principal:
              AWS: !If
                - HasExplicitPrincipal
                - !Ref CSPMPlatformPrincipalArn
                - !Sub "arn:${AWS::Partition}:iam::${CSPMPlatformAccountId}:role/${CSPMPlatformRoleName}"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - Sid: DenyAssumeWithoutExternalId
            Effect: Deny
            Principal:
              AWS: "*"
            Action: sts:AssumeRole
            Condition:
              StringNotEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: DiskScan
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSnapshotInventory
                Effect: Allow
                Resource: "*"
                Action:
                  - ec2:DescribeSnapshots
                  - ec2:DescribeSnapshotAttribute
                  - ec2:DescribeVolumes
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ec2:DescribeTags
                  - kms:DescribeKey
                  - kms:ListAliases
              - Sid: ReadSnapshotBlocksForTrivyVm
                Effect: Allow
                Resource: "*"
                Action:
                  - ebs:ListSnapshotBlocks
                  - ebs:GetSnapshotBlock
              - Sid: CreateScanSnapshots
                Effect: Allow
                Resource: "*"
                Action:
                  - ec2:CreateSnapshot
                  - ec2:CreateSnapshots
                Condition:
                  StringEquals:
                    aws:RequestTag/ManagedBy: CSPM-G3
              - Sid: TagOnlyOnSnapshotCreate
                Effect: Allow
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:*:snapshot/*"
                Action: ec2:CreateTags
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - CreateSnapshot
                      - CreateSnapshots
                      - CopySnapshot
              - Sid: ManageOwnScanSnapshotsOnly
                Effect: Allow
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:*:snapshot/*"
                Action:
                  - ec2:CopySnapshot
                  - ec2:ModifySnapshotAttribute
                  - ec2:DeleteSnapshot
                Condition:
                  StringEquals:
                    aws:ResourceTag/ManagedBy: CSPM-G3
              - Sid: ShareSnapshotsOnlyWithScannerAccount
                Effect: Deny
                Resource: "*"
                Action: ec2:ModifySnapshotAttribute
                Condition:
                  StringNotEquals:
                    ec2:Add/userId: !Ref ScannerAccountId
              - Sid: DenyPublicSnapshotSharing
                Effect: Deny
                Resource: "*"
                Action: ec2:ModifySnapshotAttribute
                Condition:
                  StringEquals:
                    ec2:Add/group: all
              # Identity-side half of CMK access only. KMS is dual-authorised:
              # the key policy on each customer managed key must name this role
              # too. Without it the copy fails at scan time, not at stack time,
              # so it reads as a broken scanner rather than a missing grant.
              - Sid: UseCmkForEncryptedSnapshotCopy
                Effect: Allow
                Resource: "*"
                Action:
                  - kms:CreateGrant
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:DescribeKey
                Condition:
                  StringLike:
                    kms:ViaService: ec2.*.amazonaws.com
      Tags:
        - Key: ManagedBy
          Value: CSPM-G3

  # ------------------------------------------------- one-click auto-connect
  # Created only when the stack was launched from a CSPM-G3 onboarding link.
  # Its whole job is to POST the role ARN back once, on Create. The customer
  # never copies an ARN. The ARN CloudFormation
  # just produced is the account the stack genuinely ran in.
  CSPMOnboardingFunctionRole:
    Type: AWS::IAM::Role
    Condition: AutoConnect
    Properties:
      Description: Execution role for the CSPM-G3 onboarding callback. Logs only.
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CSPMOnboardingLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # No AWS data permissions of any kind. The function reads one
              # string from its own event and makes one HTTPS call.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
      Tags:
        - Key: ManagedBy
          Value: CSPM-G3

  CSPMOnboardingFunction:
    Type: AWS::Lambda::Function
    Condition: AutoConnect
    Properties:
      Description: Reports the CSPM-G3 role ARN back to the platform, once, on stack create.
      Runtime: python3.12
      Handler: index.handler
      # Generous on purpose. A callback that runs out of time fails the stack,
      # and the rollback deletes the roles the customer just approved — the
      # worst outcome in the whole flow. Budget: 3 x 60s callback attempts plus
      # 2 x 5s backoff plus the 20s CloudFormation response, well inside 300.
      Timeout: 300
      MemorySize: 128
      Role: !GetAtt CSPMOnboardingFunctionRole.Arn
      Environment:
        Variables:
          CSPM_CALLBACK_URL: !Ref CallbackUrl
          CSPM_EXTERNAL_ID: !Ref ExternalId
          CSPM_ONBOARDING_TOKEN: !Ref OnboardingToken
      Code:
        ZipFile: |
          import json
          import os
          import re
          import time
          import traceback
          import urllib.error
          import urllib.request


          def _respond(event, context, status, data=None, reason=None):
              # CloudFormation only learns the outcome from this presigned S3
              # URL. A failed callback may be reported as FAILED, but a failed
              # response PUT leaves the stack waiting and can also block Delete.
              # Retry transport failures with the same immutable response body.
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Log Stream: {context.log_stream_name}",
                  "PhysicalResourceId": event.get("PhysicalResourceId") or "cspm-g3-onboarding",
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              last_error = None
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          event["ResponseURL"], data=body, method="PUT",
                          headers={"content-type": "", "content-length": str(len(body))},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          response.read()
                      return
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                      last_error = exc
                      print(
                          f"CloudFormation response PUT attempt {attempt}/3 failed: {exc}",
                          flush=True,
                      )
                      if attempt < 3:
                          time.sleep(attempt * 2)
              raise RuntimeError("CloudFormation response PUT failed after 3 attempts") from last_error


          def _post(url, body, attempts=3):
              # Onboarding is one-shot: any failure here rolls the stack back and
              # deletes the roles the customer just approved, so a slow or briefly
              # unhealthy platform must not cost them the run. Retrying is safe
              # because redeeming is idempotent for an identical role ARN — a
              # retry after a timeout that actually landed still answers
              # "connected" instead of enrolling the account twice.
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(url, data=body, method="POST")
                      request.add_header("Content-Type", "application/json")
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      # A 4xx is a verdict, not a hiccup: the token is expired,
                      # spent or forged. Retrying cannot change the answer, so
                      # fail now rather than stalling the stack for three minutes.
                      if exc.code < 500 or attempt == attempts:
                          raise
                  except urllib.error.URLError:
                      if attempt == attempts:
                          raise
                  time.sleep(5)


          def _connect(event):
              # Updates re-register an optional real-time delivery role. Delete
              # never deactivates an account implicitly.
              if event["RequestType"] == "Delete":
                  return {"connection": "unchanged"}

              role_arn = event["ResourceProperties"]["RoleArn"]
              # The account id comes from the ARN CloudFormation just produced,
              # not from anything the customer typed, so it is the account the
              # stack genuinely ran in. The platform re-checks it by assuming
              # the role before trusting anything.
              match = re.match(r"arn:aws[a-z-]*:iam::(\d{12}):role/", role_arn)
              if not match:
                  raise RuntimeError(f"unrecognised role ARN: {role_arn}")

              payload = {
                  "token": os.environ["CSPM_ONBOARDING_TOKEN"],
                  "external_id": os.environ["CSPM_EXTERNAL_ID"],
                  "role_arn": role_arn,
                  "account_identifier": match.group(1),
                  "cloud": "aws",
              }
              disk_scan_role_arn = event["ResourceProperties"].get("DiskScanRoleArn")
              if disk_scan_role_arn:
                  payload["disk_scan_role_arn"] = disk_scan_role_arn
              realtime_role_arn = event["ResourceProperties"].get("RealtimeRoleArn")
              if realtime_role_arn:
                  payload["realtime_role_arn"] = realtime_role_arn
                  payload["realtime_region"] = event["ResourceProperties"].get("RealtimeRegion")
              body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
              result = _post(os.environ["CSPM_CALLBACK_URL"], body)
              if result.get("status") != "connected":
                  raise RuntimeError(f"unexpected CSPM-G3 response: {result}")
              return {
                  "connection": "connected",
                  "role_arn": role_arn,
                  "disk_scan_role_arn": disk_scan_role_arn or "disabled",
                  "realtime_role_arn": realtime_role_arn or "disabled",
                  "account": match.group(1),
              }


          def handler(event, context):
              try:
                  result = _connect(event)
              except Exception as exc:
                  # A failed callback fails the stack on purpose. Silent partial
                  # onboarding (role created while platform remains unaware) is worse than
                  # a visible rollback.
                  print(traceback.format_exc())
                  _respond(event, context, "FAILED", {"connection": "failed"}, str(exc))
                  return
              _respond(event, context, "SUCCESS", result)

  CSPMOnboarding:
    Type: Custom::CSPMOnboarding
    Condition: AutoConnect
    Properties:
      # Bound CloudFormation wait to Lambda timeout. This avoids a one-hour
      # stuck rollback when a customer network policy prevents ResponseURL PUT.
      ServiceTimeout: 300
      # No DependsOn needed: both GetAtt references already order this after
      # the role and the function.
      ServiceToken: !GetAtt CSPMOnboardingFunction.Arn
      RoleArn: !GetAtt CSPMAccessRole.Arn
      DiskScanRoleArn: !If [ScanEnabled, !GetAtt CSPMDiskScanRole.Arn, ""]
      RealtimeRoleArn: !If [RealtimeEnabled, !GetAtt RealtimeDeliveryRole.Arn, ""]
      RealtimeRegion: !If [RealtimeEnabled, !Ref AWS::Region, ""]

Outputs:
  RoleArn:
    Description: >-
      Reported to CSPM-G3 automatically when the stack completes. Only needs
      copying if this stack was deployed without an onboarding link.
    Value: !GetAtt CSPMAccessRole.Arn
  DiskScanRoleArn:
    Condition: ScanEnabled
    Description: Optional role used only for explicitly enabled agentless EBS scanning.
    Value: !GetAtt CSPMDiskScanRole.Arn
  AccountId:
    Description: AWS account in which the onboarding stack was deployed.
    Value: !Ref "AWS::AccountId"
  Partition:
    Description: AWS partition in which the onboarding stack was deployed.
    Value: !Ref "AWS::Partition"
  RealtimeRoleArn:
    Condition: RealtimeEnabled
    Description: EventBridge delivery role allowed to publish to the Odineyes ingress bus.
    Value: !GetAtt RealtimeDeliveryRole.Arn
  RealtimeCloudTrailArn:
    Condition: RealtimeCloudTrailEnabled
    Description: Dedicated regional CloudTrail trail that provides realtime write management events.
    Value: !GetAtt RealtimeCloudTrail.Arn
  RealtimeCloudTrailLogBucketName:
    Condition: RealtimeCloudTrailEnabled
    Description: Retained, encrypted S3 bucket containing the dedicated realtime CloudTrail logs.
    Value: !Ref RealtimeCloudTrailLogBucket
